<!doctype html>
<!-- Картинка для превью ссылок (og:image). Пересобрать: node scripts/og/build.mjs → public/og.png -->
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Unbounded; font-weight: 600; src: url(../../server/fonts/Unbounded-600.woff); }
  @font-face { font-family: Onest; font-weight: 400; src: url(../../server/fonts/Onest-400.woff); }
  @font-face { font-family: Onest; font-weight: 600; src: url(../../server/fonts/Onest-600.woff); }
  @font-face { font-family: Onest; font-weight: 700; src: url(../../server/fonts/Onest-700.woff); }
  @font-face { font-family: JBM; font-weight: 400; src: url(../../server/fonts/JetBrainsMono-400.woff); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: radial-gradient(900px 520px at 88% 30%, #123643 0%, #0d1b24 62%);
    color: #f2f6f7;
    font-family: Onest, sans-serif;
  }
  .orbit { position: absolute; right: -40px; top: -10px; }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 20px; }
  .word { font-family: Unbounded; font-weight: 600; font-size: 44px; letter-spacing: -0.5px; }
  .word span { color: #ff6a1f; }
  h1 {
    position: absolute; left: 72px; top: 176px; width: 720px;
    font-family: Unbounded; font-weight: 600; font-size: 58px; line-height: 1.12; letter-spacing: -1px;
  }
  h1 em { font-style: normal; color: #3cc2b4; }
  .sub { position: absolute; left: 72px; top: 392px; width: 660px; font-size: 25px; line-height: 1.4; color: #93a7b1; }
  .chips { position: absolute; left: 72px; bottom: 52px; display: flex; gap: 12px; }
  .chip {
    padding: 11px 20px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.14);
    font-size: 22px; font-weight: 600; color: #dbe6ea; background: rgba(255,255,255,0.04);
  }
  .domain { position: absolute; right: 84px; bottom: 62px; font-family: JBM; font-size: 26px; color: #93a7b1; }
  .card {
    position: absolute; right: 84px; top: 214px; width: 300px; padding: 26px 28px;
    border-radius: 26px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
  }
  .row { display: flex; justify-content: space-between; font-size: 22px; color: #93a7b1; padding: 7px 0; }
  .row b { font-family: JBM; font-weight: 400; color: #f2f6f7; }
  .row.total { margin-top: 10px; padding-top: 16px; border-top: 1.5px solid rgba(255,255,255,0.12); color: #f2f6f7; font-weight: 600; }
  .row.total b { color: #3cc2b4; }
</style>
</head>
<body>
  <svg class="orbit" width="560" height="560" viewBox="0 0 64 64" aria-hidden="true" opacity="0.32">
    <circle cx="30" cy="35" r="15.5" fill="none" stroke="#3CC2B4" stroke-width="1.6" />
    <path d="M9 50C23 48 37 38 48.5 18.5" fill="none" stroke="#FF6A1F" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="50" cy="16" r="2" fill="#FF6A1F" />
  </svg>
  <div class="brand">
    <svg width="76" height="76" viewBox="0 0 64 64"><rect width="64" height="64" rx="17" fill="#16303b"/><circle cx="30" cy="35" r="15.5" fill="none" stroke="#3CC2B4" stroke-width="5.5"/><path d="M9 50C23 48 37 38 48.5 18.5" fill="none" stroke="#FF6A1F" stroke-width="5.5" stroke-linecap="round"/><circle cx="50" cy="16" r="5.5" fill="#FF6A1F"/></svg>
    <div class="word">Crew<span>Pay</span></div>
  </div>
  <h1>Калькулятор <em>налёта</em> и&nbsp;зарплаты экипажа</h1>
  <p class="sub">Для пилотов и бортпроводников: часы по каждому рейсу, сверка расчётного листка, <span style="white-space:nowrap">PDF-отчёт</span></p>
  <div class="card">
    <div class="row"><span>Налёт</span><b>78:40</b></div>
    <div class="row"><span>Ночные</span><b>21:05</b></div>
    <div class="row"><span>Праздничные</span><b>6:30</b></div>
    <div class="row total"><span>Сверка листка</span><b>7/7 ✓</b></div>
  </div>
  <div class="chips"><span class="chip">Рейсы</span><span class="chip">Расчётные листки</span><span class="chip">PDF</span></div>
  <div class="domain">crewpay.uz</div>
</body>
</html>
