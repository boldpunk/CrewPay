name: Server

# Обслуживание сервера по SSH из GitHub: ключ хранится в секретах репозитория.
# Логи публичного репозитория видны всем — команды ниже не печатают секретов.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать
        type: choice
        options: [status, setup, logs, restart, caddy, caddy-restart]
        default: status

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Добавьте секреты SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Email берём из секрета: значения input видны в публичных логах.
          if [ "${{ inputs.action }}" = setup ] && [ -z "${{ secrets.ADMIN_EMAIL }}" ]; then
            echo "::error::Для setup добавьте секрет ADMIN_EMAIL (email для Let's Encrypt)"
            exit 1
          fi

      - name: ${{ inputs.action }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -u
            case "${{ inputs.action }}" in
              setup)
                curl -fsSL https://raw.githubusercontent.com/boldpunk/CrewPay/${{ github.sha }}/deploy/setup-oracle.sh -o /tmp/crewpay-setup.sh
                CREWPAY_CI=1 bash /tmp/crewpay-setup.sh "${{ secrets.ADMIN_EMAIL }}"
                ;;
              status)
                echo "== система";  . /etc/os-release; echo "$PRETTY_NAME $(uname -m)"; uptime
                echo "== диск/память"; df -h / | tail -1; free -h | sed -n 2p
                echo "== порты";   sudo ss -ltnp | grep -E ':(80|443|3020) ' || echo "ничего не слушает 80/443/3020"
                echo "== docker";  docker --version 2>/dev/null || echo "docker не установлен"
                [ -d /opt/crewpay ] && (cd /opt/crewpay && docker compose ps 2>/dev/null) || echo "/opt/crewpay ещё нет"
                echo "== приложение"; curl -fsS --max-time 5 http://127.0.0.1:3020/api/health || echo "не отвечает на 127.0.0.1:3020"
                echo; echo "== подписка"; curl -fsS --max-time 5 http://127.0.0.1:3020/api/plan || echo "нет /api/plan"
                echo; [ -f /opt/crewpay/.env ] && for k in ADMIN_EMAIL CAPTCHA_SECRET PAYME_MERCHANT_ID PAYME_KEY CLICK_SERVICE_ID CLICK_MERCHANT_ID CLICK_SECRET_KEY; do grep -q "^$k=." /opt/crewpay/.env && echo "$k задан" || echo "$k НЕ задан"; done
                echo "== 80/443";  docker ps --filter publish=443 --format '{{.Names}} ({{.Image}})' 2>/dev/null || true
                command -v nginx >/dev/null && (sudo nginx -t 2>&1 | tail -1) || echo "nginx на хосте нет"
                [ -f /opt/crewpay/edge.env ] && grep EDGE_NETWORK /opt/crewpay/edge.env || true
                echo "== сертификат"; echo | openssl s_client -connect crewpay.uz:443 -servername crewpay.uz 2>/dev/null | openssl x509 -noout -subject -enddate 2>/dev/null || echo "HTTPS для crewpay.uz пока нет"
                echo "== снаружи"
                echo "== пользователи (по статусу, без адресов)"
                (cd /opt/crewpay && docker compose exec -T db psql -U crewpay crewpay -tAc "select coalesce(status,'?') || ': ' || count(*) from users group by status order by status" 2>/dev/null) || echo "нет данных"
                echo "== превью и оплата"
                curl -sS -o /dev/null -w "https://crewpay.uz/og.png → %{http_code} %{content_type}\n" --max-time 10 https://crewpay.uz/og.png || true
                for ua in TelegramBot WhatsApp/2.23 facebookexternalhit/1.1 Twitterbot/1.0; do
                  echo "$ua: $(curl -sS --max-time 10 -A "$ua" https://crewpay.uz/ | grep -oE 'property="og:(title|image)" content="[^"]*"' | sed 's/property="og://; s/" content=/=/' | tr '\n' ' ')"
                done
                curl -sSI --max-time 10 -A TelegramBot https://crewpay.uz/og.png | grep -iE '^(content-length|cross-origin-resource-policy|cache-control):' | tr -d '\r'
                curl -sS --max-time 10 -X POST -H 'content-type: application/json' -d '{"id":1,"method":"CheckTransaction","params":{"id":"x"}}' https://crewpay.uz/payments/payme | grep -o '"code":-[0-9]*' | sed 's/^/payme endpoint → /' || true
                curl -sS --max-time 10 -X POST -d 'action=0' https://crewpay.uz/payments/click/prepare | grep -o '"error":-[0-9]*' | sed 's/^/click endpoint → /' || true
                for site in crewpay.uz www.crewpay.uz boldpunk.uz fyndue.uz; do
                  curl -sS -o /dev/null -w "https://$site → %{http_code}\n" --max-time 10 "https://$site/" || echo "https://$site недоступен"
                done
                ;;
              caddy)
                # Только имена сайтов — без остального содержимого конфигов.
                sites() { grep -E '^[^#[:space:]][^{]*\{[[:space:]]*$' "$1" | sed 's/[[:space:]]*{[[:space:]]*$//' | tr '\n' ' '; echo; }
                for f in /opt/crewpay/Caddyfile.*.bak; do [ -f "$f" ] && echo "$(basename "$f"): $(sites "$f")"; done
                echo "host /opt/dcau-hub/Caddyfile: $(sudo cat /opt/dcau-hub/Caddyfile | sites /dev/stdin)"
                echo "container /etc/caddy/Caddyfile: $(docker exec dcau-hub-caddy-1 cat /etc/caddy/Caddyfile | sites /dev/stdin)"
                echo "container /tmp: $(docker exec dcau-hub-caddy-1 ls /tmp | tr '\n' ' ')"
                for f in $(docker exec dcau-hub-caddy-1 sh -c 'ls /tmp/Caddyfile* 2>/dev/null'); do echo "  $f: $(docker exec dcau-hub-caddy-1 cat "$f" | sites /dev/stdin)"; done
                echo "live config hosts: $(docker exec dcau-hub-caddy-1 wget -qO- http://localhost:2019/config/apps/http/servers 2>/dev/null | grep -o '"host":\[[^]]*\]' | tr '\n' ' ')"
                echo "network dcau-hub_default: $(docker network inspect dcau-hub_default --format '{{range .Containers}}{{.Name}} {{end}}')"
                echo "fyndue containers: $(docker ps --filter name=fyndue --format '{{.Names}}={{.Status}}' | tr '\n' ' ')"
                ;;
              caddy-restart)
                curl -fsSL https://raw.githubusercontent.com/boldpunk/CrewPay/${{ github.sha }}/deploy/caddy-restart.sh -o /tmp/crewpay-caddy-restart.sh
                bash /tmp/crewpay-caddy-restart.sh
                ;;
              logs)
                cd /opt/crewpay && docker compose logs --no-color --tail 150 web && echo "== резервные копии" && docker compose logs --no-color --tail 5 backup && ls -lh backups | tail -5
                ;;
              restart)
                echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
                cd /opt/crewpay && docker compose pull && docker compose up -d --remove-orphans && sleep 8 && docker compose ps
                ;;
            esac
