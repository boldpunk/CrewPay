name: Server

# Обслуживание сервера по SSH из GitHub: ключ хранится в секретах репозитория.
# Логи публичного репозитория видны всем — команды ниже не печатают секретов.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать
        type: choice
        options: [status, setup, logs, restart]
        default: status

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Добавьте секреты SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Email берём из секрета: значения input видны в публичных логах.
          if [ "${{ inputs.action }}" = setup ] && [ -z "${{ secrets.ADMIN_EMAIL }}" ]; then
            echo "::error::Для setup добавьте секрет ADMIN_EMAIL (email для Let's Encrypt)"
            exit 1
          fi

      - name: ${{ inputs.action }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -u
            case "${{ inputs.action }}" in
              setup)
                curl -fsSL https://raw.githubusercontent.com/boldpunk/CrewPay/${{ github.sha }}/deploy/setup-oracle.sh -o /tmp/crewpay-setup.sh
                CREWPAY_CI=1 bash /tmp/crewpay-setup.sh "${{ secrets.ADMIN_EMAIL }}"
                ;;
              status)
                echo "== система";  . /etc/os-release; echo "$PRETTY_NAME $(uname -m)"; uptime
                echo "== диск/память"; df -h / | tail -1; free -h | sed -n 2p
                echo "== порты";   sudo ss -ltnp | grep -E ':(80|443|3020) ' || echo "ничего не слушает 80/443/3020"
                echo "== docker";  docker --version 2>/dev/null || echo "docker не установлен"
                [ -d /opt/crewpay ] && (cd /opt/crewpay && docker compose ps 2>/dev/null) || echo "/opt/crewpay ещё нет"
                echo "== приложение"; curl -fsS --max-time 5 http://127.0.0.1:3020/api/health || echo "не отвечает на 127.0.0.1:3020"
                echo "== 80/443";  docker ps --filter publish=443 --format '{{.Names}} ({{.Image}})' 2>/dev/null || true
                command -v nginx >/dev/null && (sudo nginx -t 2>&1 | tail -1) || echo "nginx на хосте нет"
                [ -f /opt/crewpay/edge.env ] && grep EDGE_NETWORK /opt/crewpay/edge.env || true
                echo "== сертификат"; echo | openssl s_client -connect crewpay.uz:443 -servername crewpay.uz 2>/dev/null | openssl x509 -noout -subject -enddate 2>/dev/null || echo "HTTPS для crewpay.uz пока нет"
                echo "== снаружи"; curl -sS -o /dev/null -w 'https://crewpay.uz → %{http_code}\n' --max-time 10 https://crewpay.uz/api/health || echo "https://crewpay.uz недоступен"
                ;;
              logs)
                cd /opt/crewpay && docker compose logs --no-color --tail 200 web
                ;;
              restart)
                echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
                cd /opt/crewpay && docker compose pull web && docker compose up -d web && sleep 5 && docker compose ps
                ;;
            esac
