name: Preview check

# Проверка превью ссылок снаружи (с серверов GitHub), как его видят Telegram и WhatsApp.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for h in crewpay.uz www.crewpay.uz; do
            for t in A AAAA CAA; do echo "$h $t: $(dig +short $t $h @1.1.1.1 | tr '\n' ' ')"; done
          done
      - name: Как видят мессенджеры
        run: |
          for url in https://crewpay.uz/ https://www.crewpay.uz/; do
            for ua in TelegramBot "WhatsApp/2.23" "facebookexternalhit/1.1"; do
              out=$(curl -sSL --max-time 15 -A "$ua" -w '\n%{http_code} %{remote_ip} %{time_total}s' "$url" || echo "ОШИБКА")
              echo "$url [$ua] → $(echo "$out" | tail -1) | $(echo "$out" | grep -oE 'property="og:(title|image)" content="[^"]*"' | sed 's/property="og://; s/" content=/=/' | tr '\n' ' ')"
            done
          done
          curl -sSI --max-time 15 -A TelegramBot https://crewpay.uz/og.png | grep -iE '^(HTTP|content-type|content-length):'
          echo "== IPv6"; curl -6 -sS -o /dev/null --max-time 10 -w '%{http_code}\n' https://crewpay.uz/ || echo "IPv6 с раннера недоступен (у раннера может не быть IPv6)"
      - name: Разница между / и /?1
        run: |
          UA='TelegramBot (like TwitterBot)'
          for u in https://crewpay.uz https://crewpay.uz/ 'https://crewpay.uz/?1'; do
            echo "== $u"
            echo "GET:   $(curl -sS -o /tmp/b -A "$UA" --max-time 15 -w '%{http_code} %{size_download}B %{content_type} redirects=%{num_redirects}' "$u") og:title=$(grep -c 'og:title' /tmp/b)"
            echo "HEAD:  $(curl -sS -I -o /dev/null -A "$UA" --max-time 15 -w '%{http_code} %{content_type}' "$u")"
            echo "RANGE: $(curl -sS -o /tmp/r -H 'Range: bytes=0-4095' -A "$UA" --max-time 15 -w '%{http_code} %{size_download}B' "$u") og:title=$(grep -c 'og:title' /tmp/r)"
            echo "HTTP1: $(curl -sS --http1.1 -o /tmp/h -A "$UA" --max-time 15 -w '%{http_code}' "$u") og:title=$(grep -c 'og:title' /tmp/h)"
          done
          echo "== заголовки /"; curl -sSI -A "$UA" https://crewpay.uz/ | tr -d '\r'

