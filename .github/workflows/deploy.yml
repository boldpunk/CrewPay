name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/boldpunk/crewpay

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crewpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crewpay_test
      - run: npm run build && npm run build:server

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Oracle Cloud Ampere A1 — ARM64: собираем образ и для x86, и для ARM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Skip until the server is configured
        if: env.SSH_HOST == ''
        run: echo "::notice::Секреты SSH_HOST/SSH_USER/SSH_PRIVATE_KEY/SITE_URL не заданы — образ собран, деплой пропущен."

      - uses: actions/checkout@v4
        if: env.SSH_HOST != ''

      - name: Validate runtime secrets
        if: env.SSH_HOST != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -eu
          missing=""
          for name in SITE_URL; do
            value=$(eval "printf '%s' \"\${$name:-}\"")
            [ -n "$value" ] || missing="$missing $name"
          done
          # DATABASE_URL необязателен: без него используется своя база в Docker на сервере.
          if [ -n "${DATABASE_URL:-}" ]; then
            case "$DATABASE_URL" in postgresql://*|postgres://*) ;; *) missing="$missing DATABASE_URL(scheme)";; esac
          fi
          if [ -n "$missing" ]; then echo "::error::Не заданы секреты:$missing"; exit 1; fi

      - name: Prepare /opt/crewpay
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            [ -w /opt/crewpay ] || { sudo mkdir -p /opt/crewpay && sudo chown "$(id -un)":"$(id -gn)" /opt/crewpay; }

      - name: Copy docker-compose.yml to server
        if: env.SSH_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml,deploy/docker-compose.shared-caddy.yml
          target: /opt/crewpay
          overwrite: true

      - name: Write server .env
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            mkdir -p /opt/crewpay
            cat > /opt/crewpay/.env <<'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SITE_URL=${{ secrets.SITE_URL }}
            ENVEOF
            # Пароль своей базы создаётся один раз и остаётся на сервере (в логи не попадает).
            if [ ! -f /opt/crewpay/db.env ]; then
              umask 077
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > /opt/crewpay/db.env
            fi
            cat /opt/crewpay/db.env >> /opt/crewpay/.env
            mkdir -p /opt/crewpay/backups
            # Режим «общий Caddy» (сеть другого проекта) — его записал deploy/setup-oracle.sh.
            [ -f /opt/crewpay/edge.env ] && cat /opt/crewpay/edge.env >> /opt/crewpay/.env
            chmod 600 /opt/crewpay/.env

      - name: Pull and restart
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/crewpay
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 10
            docker compose ps
            curl -fsS --max-time 5 http://127.0.0.1:3020/api/health && echo " ← приложение отвечает"
            docker image prune -f
