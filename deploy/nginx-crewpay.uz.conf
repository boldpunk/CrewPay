# /etc/nginx/sites-available/crewpay.uz  →  ln -s ../sites-available/crewpay.uz /etc/nginx/sites-enabled/
# Затем: sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d crewpay.uz -d www.crewpay.uz
server {
    listen 80;
    listen [::]:80;
    server_name crewpay.uz www.crewpay.uz;

    # Расчётные листки — до 5 МБ.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
